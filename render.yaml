services:
  - type: web
    name: tross-linkedin-profile-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Non-secret default endpoints (public LinkedIn URLs).
      - key: LINKEDIN_PROFILE_ENDPOINT
        value: https://www.linkedin.com/flagship-web/in/{profile_slug}
      - key: LINKEDIN_CARDS_ENDPOINT
        value: https://www.linkedin.com/flagship-web/rsc-action/actions/component?componentId=com.linkedin.sdui.generated.profile.dsl.impl.profileCardsBelowActivityPart1&sduiid=com.linkedin.sdui.generated.profile.dsl.impl.profileCardsBelowActivityPart1
      # Secret values entered manually at deploy time (sync: false).
      - key: API_KEY
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: LINKEDIN_SESSION_COOKIE
        sync: false
      - key: LINKEDIN_CSRF_TOKEN
        sync: false
